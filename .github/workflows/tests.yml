name: Tests

# The mod builds against the game's own assemblies, which cannot be redistributed, so it is not built here, and the
# loading and visual tests (which load those assemblies) run only in build.ps1. tests/AllocationTests.csproj compiles
# only source/AllocationPlan.cs and references no game or package DLLs, so the allocation assertions run here, and so
# do the website's download-button checks (tests/test-site.mjs: Node only, no packages, no network) and the check that
# the manifest's version matches Directory.Build.props (tests/check-version.ps1, which build.ps1 also runs).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 8.0.x
      # NuGet.Config clears every package source, so the build must use the net8.0 targeting pack that comes with a
      # .NET 8 SDK. The runner also has newer SDKs, and without a global.json the dotnet CLI picks the newest, so pin
      # the one just installed, on the runner only (a global.json in the repository would also pin mod builds).
      - name: Pin the .NET 8 SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Allocation tests
        run: dotnet run --project tests/AllocationTests.csproj -c Release
      # Runs even when the allocation tests failed, so one run reports every failing step.
      - name: Site checks
        if: ${{ !cancelled() }}
        run: node tests/test-site.mjs
      # In Windows PowerShell 5.1, which build.ps1 runs under.
      - name: Version check
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\tests\check-version.ps1
